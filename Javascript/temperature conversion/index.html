<head>
    <title>Temperature Converter</title>
</head>
    <body>
        <form>
            <label id="l1">Enter temperature</label> <br>
            <input type="number" id="number"> <br>
            
            <input type="radio" id="cToF" name="r">
            <label for="cToF">Celcius to Fahrenheight</label><br>

            <input type="radio" id="fToC" name="r">
            <label for="fToC">Fahrenheight to Celcius</label><br>

            <button type="button" id="convert">Convert</button>
            <p id="result"></p>
            <script src="script.js"></script>
            <link rel="stylesheet" href="style.css" >
        </form>
    </body>
